<!DOCTYPE html>
<html>
  <head>
    <meta charset="utf-8" />
    <title>Emotion Analysis Recorder</title>
    <!-- Bootstrap CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <!-- Bootstrap Icons -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.10.0/font/bootstrap-icons.css" rel="stylesheet">
    <style>
      body { 
        width: 400px; 
        min-height: 450px;
        padding: 15px;
      }
      .status-indicator {
        width: 12px;
        height: 12px;
        border-radius: 50%;
        display: inline-block;
        margin-right: 8px;
      }
      .status-recording { background-color: #dc3545; animation: pulse 1.5s infinite; }
      .status-stopped { background-color: #6c757d; }
      .status-ready { background-color: #198754; }
      @keyframes pulse {
        0% { opacity: 1; }
        50% { opacity: 0.5; }
        100% { opacity: 1; }
      }
      .data-card {
        background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
        color: white;
        border-radius: 10px;
      }
      .btn-record {
        padding: 12px 20px;
        font-weight: 600;
      }
    </style>
  </head>
  <body class="bg-light">
    <div class="container-fluid p-0">
      <!-- Header -->
      <div class="text-center mb-4">
        <h4 class="text-primary mb-2">
          <i class="bi bi-camera-video me-2"></i>Emotion Analysis
        </h4>
        <p class="text-muted small">Record video to analyze emotions in real-time</p>
      </div>

      <!-- Preview (hidden) -->
      <video id="preview" autoplay muted playsinline class="d-none"></video>
      
      <!-- Recording Controls -->
      <div class="card shadow-sm mb-3">
        <div class="card-body">
          <h6 class="card-title">
            <i class="bi bi-record-circle me-2"></i>Recording Controls
          </h6>
          
          <div class="d-grid gap-2">
            <button id="startBtn" class="btn btn-danger btn-record">
              <i class="bi bi-record-circle me-2"></i>Start Recording
            </button>
            <button id="stopBtn" class="btn btn-outline-secondary" disabled>
              <i class="bi bi-stop-circle me-2"></i>Stop Recording
            </button>
          </div>
        </div>
      </div>

      <!-- Status Display -->
      <div class="card shadow-sm mb-3">
        <div class="card-body">
          <h6 class="card-title">
            <i class="bi bi-info-circle me-2"></i>Status
          </h6>
          <div class="d-flex align-items-center mb-2">
            <span id="statusIndicator" class="status-indicator status-ready"></span>
            <span id="status" class="small">Ready to record</span>
          </div>
          <div id="recordingTimer" class="text-muted small d-none">
            <i class="bi bi-clock me-1"></i>Recording: <span id="timerDisplay">0s</span>
          </div>
        </div>
      </div>
<!--  za current emotion -->
      <div class="card shadow-sm mb-3">
        <div class="card-body">
          <h6 class="card-title">
            <i class="bi bi-emoji-smile me-2"></i>Current Emotion
          </h6>
          <div id="currentEmotion" class="emotion-display text-muted">
            --
          </div>
          <div class="confidence-info">
            <div class="d-flex justify-content-between small text-muted">
              <span>Confidence:</span>
              <span id="confidenceValue">--%</span>
            </div>
            <div class="confidence-bar">
              <div id="confidenceBar" class="confidence-fill" style="width: 0%"></div>
            </div>
          </div>
          <div id="lastUpdate" class="small text-muted text-center">
            Last update: --
          </div>
        </div>
      </div>

      <!-- Report Generation -->
      <div class="card shadow-sm">
        <div class="card-body">
          <h6 class="card-title">
            <i class="bi bi-download me-2"></i>Reports
          </h6>
          <div class="d-grid gap-2">
            <button id="reportBtn" class="btn btn-success" disabled>
              <i class="bi bi-file-earmark-spreadsheet me-2"></i>Generate Report (CSV)
            </button>
          </div>
          <div id="reportStatus" class="mt-2 small text-muted">
            No data collected yet
          </div>
        </div>
      </div>


    <!-- Bootstrap JS -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    
    <!-- Your Modules -->
    <script src="modules/recorder.js"></script>
    <script src="modules/api.js"></script>
    <script src="modules/report.js"></script>
    <script src="utils/helpers.js"></script>
    <script src="popup.js"></script>
  </body>
</html>
